<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>CraftCycle Market — Scrap Marketplace</title>
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>♻️</text></svg>">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="../assets/css/style.css" />
  <style>
    /* ── Public Hero Banner ── */
    .market-hero {
      background: linear-gradient(135deg, rgba(0, 255, 136, 0.07) 0%, rgba(0, 212, 255, 0.05) 100%);
      border-bottom: 1px solid var(--border);
      padding: var(--s8) var(--s8) var(--s6);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--s6);
      flex-wrap: wrap;
    }

    .market-hero-text h1 {
      font-family: var(--font-display);
      font-size: clamp(1.2rem, 3vw, 1.8rem);
      font-weight: 900;
      margin-bottom: var(--s2);
    }

    .market-hero-stats {
      display: flex;
      gap: var(--s6);
    }

    .hs-val {
      font-family: var(--font-display);
      font-size: 1.2rem;
      font-weight: 900;
    }

    /* ── Layout ── */
    .market-layout {
      display: grid;
      grid-template-columns: 240px 1fr;
      gap: var(--s6);
      padding: var(--s6);
    }

    .filter-panel {
      position: sticky;
      top: 80px;
    }

    /* ── Filter Panel ── */
    .filter-card {
      padding: var(--s5);
    }

    .filter-group {
      margin-bottom: var(--s5);
    }

    .filter-label {
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--text-3);
      margin-bottom: var(--s3);
      display: block;
    }

    .cat-chips {
      display: flex;
      flex-direction: column;
      gap: var(--s1);
    }

    .cat-chip {
      padding: 8px var(--s3);
      border-radius: var(--r-md);
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text-2);
      cursor: pointer;
      transition: all .15s;
      display: flex;
      align-items: center;
      gap: var(--s2);
      background: none;
      border: none;
      text-align: left;
      width: 100%;
    }

    .cat-chip:hover {
      background: var(--surface-3);
      color: var(--text-1);
    }

    .cat-chip.active {
      background: var(--green-glow);
      color: var(--green);
    }

    .cat-count {
      margin-left: auto;
      font-size: 0.7rem;
      color: var(--text-3);
    }

    .cat-chip.active .cat-count {
      color: rgba(0, 255, 136, .6);
    }

    .price-range {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--s2);
    }

    /* ── Listing Grid ── */
    .listings-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: var(--s5);
    }

    .listing-card {
      overflow: hidden;
      cursor: pointer;
      transition: all .25s;
    }

    .listing-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 30px rgba(0, 0, 0, .5);
    }

    .listing-thumb {
      height: 160px;
      background: var(--surface-3);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .listing-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .listing-body {
      padding: var(--s4);
    }

    .listing-title {
      font-weight: 700;
      font-size: .9rem;
      margin-bottom: var(--s2);
    }

    .listing-meta {
      display: flex;
      gap: var(--s3);
      font-size: .75rem;
      color: var(--text-3);
      margin-bottom: var(--s3);
      flex-wrap: wrap;
    }

    .listing-price {
      display: flex;
      align-items: baseline;
      gap: var(--s2);
    }

    .listing-price-main {
      font-family: var(--font-display);
      font-size: 1.05rem;
      font-weight: 900;
      color: var(--green);
    }

    .listing-footer {
      padding: var(--s3) var(--s4);
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .listing-seller {
      display: flex;
      align-items: center;
      gap: var(--s2);
      font-size: .75rem;
      color: var(--text-3);
    }

    .listing-seller-av {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--green-glow);
      border: 1px solid rgba(0, 255, 136, .3);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: .65rem;
      font-weight: 700;
      color: var(--green);
    }

    .wishlist-btn {
      background: none;
      border: none;
      font-size: 1rem;
      cursor: pointer;
      padding: 4px;
      border-radius: var(--r-sm);
      transition: transform .15s;
    }

    .wishlist-btn:hover {
      transform: scale(1.2);
    }

    /* ── Listing detail modal ── */
    .listing-modal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 700;
      background: rgba(0, 0, 0, .85);
      backdrop-filter: blur(8px);
      overflow-y: auto;
      padding: var(--s6);
    }

    .listing-modal.open {
      display: flex;
      align-items: flex-start;
      justify-content: center;
    }

    .lmodal-inner {
      background: var(--surface-1);
      border: 1px solid var(--border);
      border-radius: var(--r-2xl);
      width: 100%;
      max-width: 680px;
      margin: auto;
      animation: fadeUp .3s ease;
      overflow: hidden;
    }

    .lmodal-thumb {
      height: 260px;
      background: var(--surface-3);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .lmodal-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .lmodal-close {
      position: absolute;
      top: var(--s4);
      right: var(--s4);
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(0, 0, 0, .6);
      border: 1px solid var(--border);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      color: var(--text-1);
      transition: background .15s;
    }

    .lmodal-close:hover {
      background: var(--red-glow);
    }

    .lmodal-body {
      padding: var(--s6);
    }

    .lmodal-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: var(--s3);
      margin: var(--s5) 0;
    }

    .lstat {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--r-md);
      padding: var(--s3);
      text-align: center;
    }

    .lstat-val {
      font-family: var(--font-mono);
      font-weight: 700;
      font-size: .95rem;
      color: var(--green);
    }

    .lstat-lbl {
      font-size: .65rem;
      color: var(--text-3);
      text-transform: uppercase;
      letter-spacing: .08em;
      margin-top: 2px;
    }

    /* ── Create listing modal ── */
    .create-modal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 800;
      background: rgba(0, 0, 0, .85);
      backdrop-filter: blur(8px);
      overflow-y: auto;
      padding: var(--s6);
    }

    .create-modal.open {
      display: flex;
      align-items: flex-start;
      justify-content: center;
    }

    .cmodal-inner {
      background: var(--surface-1);
      border: 1px solid var(--border);
      border-radius: var(--r-2xl);
      width: 100%;
      max-width: 560px;
      margin: auto;
      animation: fadeUp .3s ease;
      padding: var(--s7);
    }

    /* ── Auth Gate Banner ── */
    .auth-gate-banner {
      background: linear-gradient(135deg, rgba(0, 255, 136, .08), rgba(0, 212, 255, .05));
      border: 1px solid rgba(0, 255, 136, .2);
      border-radius: var(--r-xl);
      padding: var(--s5) var(--s6);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--s4);
      flex-wrap: wrap;
      margin-bottom: var(--s5);
    }

    /* ── Mobile Filter Drawer ── */
    .filter-drawer-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.7);
      backdrop-filter: blur(4px);
      z-index: 900;
    }
    .filter-drawer-overlay.open { display: block; }

    @media(max-width:900px) {
      .market-layout {
        grid-template-columns: 1fr;
      }

      .filter-panel {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        background: var(--surface-1);
        border-top: 1px solid var(--border);
        border-radius: var(--r-2xl) var(--r-2xl) 0 0;
        padding: var(--s6);
        z-index: 901;
        transform: translateY(100%);
        transition: transform .4s cubic-bezier(0.4, 0, 0.2, 1);
        max-height: 80vh;
        overflow-y: auto;
      }
      .filter-panel.open { transform: translateY(0); }
      
      .mobile-filter-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: var(--s4) var(--s6);
        background: var(--surface-2);
        border-bottom: 1px solid var(--border);
        position: sticky;
        top: 0;
        z-index: 100;
      }
    }

    @media(min-width:901px) {
      .mobile-filter-bar { display: none; }
    }
  </style>
</head>

<body>
  <div class="sidebar-overlay"></div>
  <div class="app-shell">

    <!-- ── Sidebar ── -->
    <aside class="sidebar">
      <div class="sidebar-logo">
        <div class="logo-mark">
          <div class="logo-icon">♻️</div>
          <div>
            <div class="logo-text">CraftCycle</div>
            <div class="logo-sub">Market</div>
          </div>
        </div>
      </div>
      <nav class="sidebar-nav"></nav>
      <div class="sidebar-footer"></div>
    </aside>

    <!-- ── Main ── -->
    <div class="main-content">
      <div class="filter-drawer-overlay" onclick="toggleFilters()"></div>
      <header class="topbar">
        <div class="topbar-left">
          <button class="hamburger"><span></span><span></span><span></span></button>
          <div class="page-title">MARKETPLACE</div>
        </div>
        <div class="topbar-right">
          <button class="notif-btn">🔔<span class="notif-dot"></span></button>
          <div class="user-avatar" data-user-avatar></div>
        </div>
      </header>

      <main>
        <!-- Hero -->
        <div class="market-hero">
          <div class="market-hero-text">
            <h1 id="hero-title">♻️ Scrap Materials <span class="text-green">Marketplace</span></h1>
            <p class="text-secondary" style="font-size:.875rem;line-height:1.6;margin-top:var(--s2)">
              Buy &amp; sell quality items. Connect with sellers across India.
            </p>
          </div>
          <div class="market-hero-stats">
            <div style="text-align:center">
              <div class="hs-val text-green" id="stat-listings">1,240</div>
              <div style="font-size:.7rem;color:var(--text-3)">Active Listings</div>
            </div>
            <div style="text-align:center">
              <div class="hs-val text-cyan">380+</div>
              <div style="font-size:.7rem;color:var(--text-3)">Sellers</div>
            </div>
            <div style="text-align:center">
              <div class="hs-val text-purple">48T</div>
              <div style="font-size:.7rem;color:var(--text-3)">Waste Saved</div>
            </div>
          </div>
          <button class="btn btn-primary" id="list-btn" onclick="openCreateListing()">
            + List Material
          </button>
        </div>

        <!-- Mobile Filter Bar (Visible only on <900px) -->
        <div class="mobile-filter-bar">
          <button class="btn btn-ghost btn-sm" onclick="toggleFilters()" style="gap:var(--s2)">
            🔍 Filters &amp; Categories
          </button>
          <span id="mobile-result-count" style="font-size:.75rem;color:var(--text-3)"></span>
        </div>

        <!-- Tabs -->
        <div style="display:flex;gap:var(--s4);padding:var(--s4) var(--s6);border-bottom:1px solid var(--border);">
          <button id="tab-scrap" class="btn btn-primary" onclick="switchTab('scrap')" style="flex:1;">Raw Scrap
            Materials</button>
          <button id="tab-diy" class="btn btn-ghost" onclick="switchTab('diy')"
            style="flex:1; border: 1px solid var(--border);">DIY Creation Products</button>
        </div>

        <!-- Search & Sort Bar -->
        <div class="search-sort-row"
          style="display:flex;gap:var(--s3);padding:var(--s4) var(--s6);border-bottom:1px solid var(--border);flex-wrap:wrap;align-items:center">
          <div style="flex:1;min-width:200px;position:relative">
            <span style="position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--text-3)">🔍</span>
            <input class="form-input" type="text" id="search-input" placeholder="Search materials, location, seller…"
              style="padding-left:40px;width:100%" oninput="debounce(applyFilters,350)()" />
          </div>
          <select class="form-input" id="sort-select" style="width:auto;font-size:.82rem" onchange="applyFilters()">
            <option value="newest">Newest First</option>
            <option value="price_asc">Price: Low to High</option>
            <option value="price_desc">Price: High to Low</option>
            <option value="popular">Most Viewed</option>
          </select>
          <span class="text-muted" id="result-count" style="font-size:.8rem"></span>
        </div>

        <!-- Body -->
        <div class="market-layout">

          <!-- Filter Panel -->
          <div class="filter-panel">
            <div class="card filter-card">

              <div class="filter-group">
                <span class="filter-label">📦 Category</span>
                <div class="cat-chips" id="cat-chips">
                  <button class="cat-chip active" data-cat="" onclick="setCategory(this,'')">🌟 All Materials<span
                      class="cat-count" id="cc-all"></span></button>
                  <button class="cat-chip" data-cat="wood" onclick="setCategory(this,'wood')">🪵 Wood<span
                      class="cat-count"></span></button>
                  <button class="cat-chip" data-cat="metal" onclick="setCategory(this,'metal')">⚙️ Metal<span
                      class="cat-count"></span></button>
                  <button class="cat-chip" data-cat="plastic" onclick="setCategory(this,'plastic')">♻️ Plastic<span
                      class="cat-count"></span></button>
                  <button class="cat-chip" data-cat="fabric" onclick="setCategory(this,'fabric')">🧵 Fabric<span
                      class="cat-count"></span></button>
                  <button class="cat-chip" data-cat="paper" onclick="setCategory(this,'paper')">📄 Paper<span
                      class="cat-count"></span></button>
                  <button class="cat-chip" data-cat="glass" onclick="setCategory(this,'glass')">🫙 Glass<span
                      class="cat-count"></span></button>
                  <button class="cat-chip" data-cat="e-waste" onclick="setCategory(this,'e-waste')">💻 E-Waste<span
                      class="cat-count"></span></button>
                  <button class="cat-chip" data-cat="organic" onclick="setCategory(this,'organic')">🌿 Organic<span
                      class="cat-count"></span></button>
                  <button class="cat-chip" data-cat="rubber" onclick="setCategory(this,'rubber')">⚫ Rubber<span
                      class="cat-count"></span></button>
                </div>
              </div>

              <div class="filter-group">
                <span class="filter-label">⭐ Quality</span>
                <select class="form-input" id="quality-filter" style="font-size:.82rem" onchange="applyFilters()">
                  <option value="">All Qualities</option>
                  <option value="excellent">⭐⭐⭐⭐ Excellent</option>
                  <option value="good">⭐⭐⭐ Good</option>
                  <option value="fair">⭐⭐ Fair</option>
                  <option value="poor">⭐ Poor</option>
                </select>
              </div>

              <div class="filter-group">
                <span class="filter-label">💰 Price Range (₹)</span>
                <div class="price-range">
                  <input class="form-input" type="number" id="price-min" placeholder="Min" style="font-size:.82rem"
                    oninput="debounce(applyFilters,500)()" />
                  <input class="form-input" type="number" id="price-max" placeholder="Max" style="font-size:.82rem"
                    oninput="debounce(applyFilters,500)()" />
                </div>
              </div>

              <div class="filter-group">
                <span class="filter-label">📍 Location</span>
                <input class="form-input" type="text" id="location-filter" placeholder="City or state…"
                  style="font-size:.82rem" oninput="debounce(applyFilters,350)()" />
              </div>

              <div class="filter-group" style="margin-bottom:0">
                <label style="display:flex;align-items:center;gap:var(--s3);cursor:pointer;font-size:.875rem">
                  <input type="checkbox" id="barter-filter" style="accent-color:var(--green);width:16px;height:16px"
                    onchange="applyFilters()" />
                  <span>🔄 Barter available</span>
                </label>
              </div>

              <button class="btn btn-ghost btn-sm w-full" style="margin-top:var(--s4)" onclick="resetFilters()">↺ Reset
                Filters</button>
            </div>
          </div>

          <!-- Listings Grid -->
          <div>
            <div class="listings-grid" id="listings-grid"></div>
            <div id="pagination" style="display:flex;justify-content:center;gap:var(--s2);margin-top:var(--s8)"></div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- ── Listing Detail Modal ── -->
  <div class="listing-modal" id="listing-modal" onclick="if(event.target===this)closeModal('listing-modal')">
    <div class="lmodal-inner">
      <div class="lmodal-thumb" id="lmodal-thumb">
        <button class="lmodal-close" onclick="closeModal('listing-modal')">✕</button>
      </div>
      <div class="lmodal-body" id="lmodal-body"></div>
    </div>
  </div>

  <!-- ── Create Listing Modal (auth-gated) ── -->
  <div class="create-modal" id="create-modal" onclick="if(event.target===this)closeModal('create-modal')">
    <div class="cmodal-inner">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--s6)">
        <h2 style="font-family:var(--font-display);font-size:1rem;font-weight:900">📦 List Scrap Material</h2>
        <button class="btn btn-ghost btn-sm" onclick="closeModal('create-modal')">✕</button>
      </div>
      <form onsubmit="submitListing(event)">
        <div class="form-group">
          <label class="form-label">Title *</label>
          <input class="form-input" id="c-title" required placeholder="e.g. Teak Wood Offcuts — 20kg" />
        </div>
        <div class="form-group">
          <label class="form-label">Description</label>
          <textarea class="form-input" id="c-desc" rows="3" placeholder="Condition, dimensions, source…"></textarea>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:var(--s4)">
          <div class="form-group">
            <label class="form-label">Category *</label>
            <select class="form-input" id="c-cat" required>
              <option value="">Select…</option>
              <option>wood</option>
              <option>metal</option>
              <option>plastic</option>
              <option>fabric</option>
              <option>paper</option>
              <option>glass</option>
              <option>e-waste</option>
              <option>organic</option>
              <option>rubber</option>
              <option>other</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Quality *</label>
            <select class="form-input" id="c-quality" required>
              <option value="">Select…</option>
              <option value="excellent">Excellent</option>
              <option value="good">Good</option>
              <option value="fair">Fair</option>
              <option value="poor">Poor</option>
            </select>
          </div>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:var(--s4)">
          <div class="form-group">
            <label class="form-label">Quantity (kg) *</label>
            <input class="form-input" id="c-qty" type="number" min="0.1" step="0.1" required placeholder="e.g. 10" />
          </div>
          <div class="form-group">
            <label class="form-label">Price per kg (₹) *</label>
            <input class="form-input" id="c-price" type="number" min="0" required placeholder="e.g. 15" />
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">City / State *</label>
          <input class="form-input" id="c-location" required placeholder="e.g. Mysuru, Karnataka" />
        </div>
        <label
          style="display:flex;align-items:center;gap:var(--s3);margin-bottom:var(--s5);cursor:pointer;font-size:.875rem">
          <input type="checkbox" id="c-barter" style="accent-color:var(--green);width:16px;height:16px" />
          <span>Open to barter / exchange</span>
        </label>
        <div id="c-barter-field" style="display:none" class="form-group">
          <label class="form-label">Exchange for…</label>
          <input class="form-input" id="c-barter-txt" placeholder="What would you accept in return?" />
        </div>
        <button type="submit" class="btn btn-primary w-full">📤 Publish Listing</button>
      </form>
    </div>
  </div>

  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/utils.js"></script>
  <script src="../assets/js/lang.js"></script>
  <script src="../assets/js/chatbot.js?v=2.3"></script>
  <script>
    // ── OPEN PAGE — no requireAuth() on load ──────────────

    let allListings = [];
    let currentCat = "";
    let currentPage = 1;
    let currentTab = "scrap";
    const PER_PAGE = 12;

    // ── Seed demo listings ────────────────────────────────
    function getScrapListings() {

    function switchTab(tab) {
      currentTab = tab;
      document.getElementById("tab-scrap").className = tab === 'scrap' ? 'btn btn-primary' : 'btn btn-ghost';
      document.getElementById("tab-scrap").style.border = tab === 'scrap' ? 'none' : '1px solid var(--border)';
      document.getElementById("tab-diy").className = tab === 'diy' ? 'btn btn-primary' : 'btn btn-ghost';
      document.getElementById("tab-diy").style.border = tab === 'diy' ? 'none' : '1px solid var(--border)';

      if (tab === 'scrap') {
        document.getElementById('hero-title').innerHTML = `♻️ Scrap Materials <span class="text-green">Marketplace</span>`;
        document.getElementById('list-btn').textContent = `+ List Material`;
      } else {
        document.getElementById('hero-title').innerHTML = `🛠️ DIY Creations <span class="text-green">Marketplace</span>`;

    // ── Load & render ─────────────────────────────────────
    async function loadListings() {
      const params = {
        category: currentCat,
        quality: document.getElementById("quality-filter")?.value,
        search: document.getElementById("search-input")?.value,
        barter: document.getElementById("barter-filter")?.checked,
        sort: document.getElementById("sort-select")?.value,
        per_page: 100
      };

      try {
        let backendItems = [];
        if (currentTab === 'scrap') {
          const data = await MarketplaceAPI.list(params);
          backendItems = (data.listings || []).map(l => ({
            id: l.id,
            title: l.title,
            description: l.description,
            category: l.category,
            quality: l.quality,
            qty: l.quantity_kg,
            price: l.price_per_kg,
            location: `${l.location_city}${l.location_state ? ', ' + l.location_state : ''}`,
            barter: l.is_barter_ok,
            views: l.view_count || 0,
            seller: l.seller?.full_name || "Seller",
            sellerInit: (l.seller?.full_name || "S").charAt(0),
            image: l.images?.[0] || "../assets/img/cardboard_rolls.webp"
          }));
        } else {
          // DIY Tab -> Fetch from ProductsAPI
          const data = await ProductsAPI.list(params);
          backendItems = (data.products || []).map(p => ({
            id: p.id,
            title: p.title,
            description: p.description,
            category: p.category,
            quality: "excellent", // Products usually excellent
            qty: 1, 
            price: p.price,
            location: "CraftCycle Hub", // Products might be shipped from central
            barter: false,
            views: p.view_count || 0,
            seller: p.seller?.full_name || "Creator",
            sellerInit: (p.seller?.full_name || "C").charAt(0),
            image: p.images?.[0] || "../assets/img/upcycled_wooden_planter.webp"
          }));
        }

        // Merge with demo data
        const demoData = currentTab === 'scrap' ? getScrapListings() : getDiyListings();
        allListings = [...backendItems, ...demoData];
        
        applyFilters();
      } catch (err) {
        console.error("Backend fetch failed:", err);
        allListings = currentTab === 'scrap' ? getScrapListings() : getDiyListings();
        applyFilters();
      }
    }

    function buildParams() {
      return {
        page: 1, per_page: 100,
        category: currentCat,
        quality: document.getElementById("quality-filter").value,
        search: document.getElementById("search-input").value,
        location: document.getElementById("location-filter").value,
        price_min: document.getElementById("price-min").value,
        price_max: document.getElementById("price-max").value,
        barter: document.getElementById("barter-filter").checked ? true : "",
        sort: document.getElementById("sort-select").value,
      };
    }

    function applyFilters() {
      const params = buildParams();
      let filtered = [...allListings];

      if (params.category) filtered = filtered.filter(l => l.category === params.category);
      if (params.quality) filtered = filtered.filter(l => l.quality === params.quality);
      if (params.barter) filtered = filtered.filter(l => l.barter);
      if (params.search) { const q = params.search.toLowerCase(); filtered = filtered.filter(l => l.title.toLowerCase().includes(q) || l.description.toLowerCase().includes(q) || l.location.toLowerCase().includes(q)); }
      if (params.location) { const q = params.location.toLowerCase(); filtered = filtered.filter(l => l.location.toLowerCase().includes(q)); }
      if (params.price_min) filtered = filtered.filter(l => l.price * l.qty >= parseFloat(params.price_min));
      if (params.price_max) filtered = filtered.filter(l => l.price * l.qty <= parseFloat(params.price_max));

      if (params.sort === "price_asc") filtered.sort((a, b) => a.price - b.price);
      if (params.sort === "price_desc") filtered.sort((a, b) => b.price - a.price);
      if (params.sort === "popular") filtered.sort((a, b) => (b.views || 0) - (a.views || 0));

      renderListings(filtered);
    }

    // ── Cart helpers ─────────────────────────────────────────
    const CART_KEY = 'craftcycle_cart';
    function getCart() { try { return JSON.parse(localStorage.getItem(CART_KEY)) || []; } catch { return []; } }
    function saveCart(c) { localStorage.setItem(CART_KEY, JSON.stringify(c)); }
    function getCartCount() { return getCart().reduce((s, i) => s + i.qty, 0); }

    function addToCart(id) {
      if (!requireAuthForAction("Login to add items to your cart.")) return;
      const l = allListings.find(x => x.id === id);
      if (!l) return;
      const cart = getCart();
      const existing = cart.find(i => i.id === id && i.type === currentTab);
      if (existing) {
        existing.qty += l.qty;
      } else {
        cart.push({ id: l.id, type: currentTab, name: l.title, price: l.price, qty: l.qty, image: l.image, category: l.category, quality: l.quality, location: l.location });
      }
      saveCart(cart);
      updateCartBadge();
      Toast.success("Added to Cart! 🛒", `${l.title} added. <a href="cart.html" style="color:var(--green);font-weight:700">View Cart →</a>`);
    }

    function buyNow(id) {
      if (!requireAuthForAction("Login to purchase scrap materials.")) return;
      const l = allListings.find(x => x.id === id);
      if (!l) return;
      const cart = [{ id: l.id, type: currentTab, name: l.title, price: l.price, qty: l.qty, image: l.image, category: l.category, quality: l.quality, location: l.location }];
      const subtotal = l.price * l.qty;
      const fee = Math.round(subtotal * 0.02);
      sessionStorage.setItem('craftcycle_checkout_summary', JSON.stringify({
        items: cart, subtotal, delivery: 49, fee, promoDiscount: 0, total: subtotal + 49 + fee
      }));
      window.location.href = 'checkout.html';
    }

    function updateCartBadge() {
      const count = getCartCount();
      let badge = document.getElementById('cart-nav-badge');
      if (!badge) return;
      badge.textContent = count > 0 ? count : '';
      badge.style.display = count > 0 ? 'flex' : 'none';
    }

    function contactSeller(id) {
      if (!requireAuthForAction("Login to contact sellers.")) return;
      Toast.success("Connected!", "Seller details are now visible in your inbox.");
      closeModal("listing-modal");
    }

    function addWishlist(id) {
      if (!requireAuthForAction("Login to save items to your wishlist.")) return;
      Toast.success("Added!", "Item saved to your wishlist.");
    }

    function openCreateListing() {
      if (!requireAuthForAction("Login to list your scrap materials for sale.")) return;
      document.getElementById("create-modal").classList.add("open");
      document.body.style.overflow = "hidden";
    }

    async function submitListing(e) {
      e.preventDefault();
      const barter = document.getElementById("c-barter").checked;
      const btn = e.target.querySelector('button[type="submit"]');
      btn.disabled = true;
      btn.textContent = "Publishing...";

      const payload = {
        title: document.getElementById("c-title").value,
        description: document.getElementById("c-desc").value,
        category: document.getElementById("c-cat").value,
        quality: document.getElementById("c-quality").value,
        quantity_kg: parseFloat(document.getElementById("c-qty").value),
        price_per_kg: parseFloat(document.getElementById("c-price").value),
        location_city: document.getElementById("c-location").value.split(',')[0].trim(),
        location_state: document.getElementById("c-location").value.split(',')[1]?.trim() || "",
        is_barter_ok: barter,
        barter_for: barter ? document.getElementById("c-barter-txt").value : "",
        status: "active"
      };

      try {
        // Use real backend API
        await MarketplaceAPI.create(payload);
        Toast.success("Listed! 🎉", "Your material is now live in the marketplace.");
        closeModal("create-modal");
        e.target.reset();
        document.getElementById("c-barter-field").style.display = "none";
        loadListings(); // Refresh listings
      } catch (err) {
        Toast.error("Failed to list", err.message);
      } finally {
        btn.disabled = false;
        btn.textContent = "📤 Publish Listing";
      }
    }

    // Barter field toggle
    document.getElementById("c-barter").addEventListener("change", function () {
      document.getElementById("c-barter-field").style.display = this.checked ? "block" : "none";
    });

    // ── Helpers ───────────────────────────────────────────
    function closeModal(id) { document.getElementById(id).classList.remove("open"); document.body.style.overflow = ""; }
    function toggleFilters() {
      const panel = document.querySelector('.filter-panel');
      const overlay = document.querySelector('.filter-drawer-overlay');
      panel.classList.toggle('open');
      overlay.classList.toggle('open');
    }
    function setCategory(el, cat) {
      currentCat = cat;
      document.querySelectorAll(".cat-chip").forEach(c => c.classList.remove("active"));
      el.classList.add("active");
      applyFilters();
      if (window.innerWidth <= 900) toggleFilters(); // Close drawer on selection
    }
    function resetFilters() {
      currentCat = "";
      document.querySelectorAll(".cat-chip").forEach(c => c.classList.remove("active"));
      document.querySelector('.cat-chip[data-cat=""]').classList.add("active");
      document.getElementById("search-input").value = "";
      document.getElementById("quality-filter").value = "";
      document.getElementById("price-min").value = "";
      document.getElementById("price-max").value = "";
      document.getElementById("location-filter").value = "";
      document.getElementById("barter-filter").checked = false;
      applyFilters();
    }
    function qualityColor(q) { return { excellent: "green", good: "cyan", fair: "orange", poor: "red" }[q] || "gray"; }

    // ── Cart Button in Topbar ──────────────────────────────
    function injectCartBtn() {
      const right = document.querySelector('.topbar-right');
      if (!right || document.getElementById('cart-topbar-btn')) return;
      const btn = document.createElement('a');
      btn.href = 'cart.html';
      btn.id = 'cart-topbar-btn';
      btn.title = 'My Cart';
      btn.style.cssText = 'position:relative;display:flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:var(--r-md);background:var(--surface-3);border:1px solid var(--border);text-decoration:none;font-size:1.1rem;transition:background .15s';
      btn.textContent = '🛒';
      btn.onmouseenter = () => btn.style.background = 'var(--green-glow)';
      btn.onmouseleave = () => btn.style.background = 'var(--surface-3)';
      const badge = document.createElement('span');
      badge.id = 'cart-nav-badge';
      badge.style.cssText = 'position:absolute;top:-4px;right:-4px;background:var(--green);color:#000;border-radius:50%;width:16px;height:16px;font-size:.55rem;font-weight:900;display:none;align-items:center;justify-content:center;font-family:var(--font-mono)';
      btn.appendChild(badge);
      right.insertBefore(btn, right.firstChild);
      updateCartBadge();
    }

    // ── Init ─────────────────────────────────────────────
    document.addEventListener("DOMContentLoaded", () => {
      updatePublicNav();
      loadListings();
      injectCartBtn();
    });
    document.addEventListener("keydown", e => { if (e.key === "Escape") { closeModal("listing-modal"); closeModal("create-modal"); } });
  </script>
</body>

</html>
