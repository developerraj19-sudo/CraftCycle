<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>CraftCycle Market — Orders</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>♻️</text></svg>">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="../assets/css/style.css" />
</head>

<body>
    <div class="sidebar-overlay"></div>
    <div class="app-shell">
        <aside class="sidebar">
            <div class="sidebar-logo">
                <div class="logo-mark">
                    <div class="logo-icon">♻️</div>
                    <div>
                        <div class="logo-text">CraftCycle</div>
                        <div class="logo-sub">Market</div>
                    </div>
                </div>
            </div>
            <nav class="sidebar-nav"></nav>
            <div class="sidebar-footer"></div>
        </aside>

        <div class="main-content">
            <header class="topbar">
                <div class="topbar-left"><button class="hamburger"><span></span><span></span><span></span></button>
                    <div class="page-title">ORDERS</div>
                </div>
                <div class="topbar-right"><button class="notif-btn">🔔<span class="notif-dot"></span></button>
                    <div class="user-avatar" data-user-avatar></div>
                </div>
            </header>
            <main class="dash-content">
                <h1 style="font-family:var(--font-display); font-size:1.5rem; margin-bottom:var(--s6);">My Orders</h1>

                <div id="orders-container">
                    <div class="skeleton" style="height:120px; margin-bottom:var(--s5)"></div>
                    <div class="skeleton" style="height:120px; margin-bottom:var(--s5)"></div>
                </div>

            </main>
        </div>
    </div>
    <script src="../assets/js/config.js"></script>
    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/utils.js"></script>
    <script>
        requireAuth();
        document.addEventListener("DOMContentLoaded", async () => {
            try { 
                const userData = await AuthAPI.me(); 
                populateUserInfo(userData.user); 
                loadOrders();
            } catch (e) { }
        });

        async function loadOrders() {
            const container = document.getElementById('orders-container');
            try {
                const data = await OrdersAPI.list();
                const orders = data.orders || [];

                if (orders.length === 0) {
                    container.innerHTML = `
                        <div class="card" style="padding:var(--s10); text-align:center">
                            <div style="font-size:3rem; margin-bottom:var(--s4)">📦</div>
                            <div class="text-muted">You haven't placed any orders yet.</div>
                            <a href="marketplace.html" class="btn btn-primary" style="margin-top:var(--s5)">Go to Marketplace</a>
                        </div>
                    `;
                    return;
                }

                container.innerHTML = orders.map(order => `
                    <div class="card reveal" style="margin-bottom: var(--s5);">
                        <div style="padding: var(--s4); display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--surface-3);">
                            <div>
                                <div style="font-size: 0.8rem; color: var(--text-3);">Order #ORD-${order.id}</div>
                                <div style="font-weight: 600;">${order.items.map(i => i.title).join(', ')}</div>
                            </div>
                            <div style="text-align: right;">
                                <span class="badge badge-${getStatusColor(order.status)}">${order.status}</span>
                                <div style="font-family: var(--font-mono); color: var(--green); margin-top: 4px;">₹ ${order.total_amount.toLocaleString()}</div>
                            </div>
                        </div>
                        <div style="padding: var(--s4); background: rgba(255,255,255,0.02); display: flex; justify-content: space-between; align-items: center;">
                            <span style="font-size: 0.8rem; color: var(--text-3);">Placed: ${new Date(order.created_at).toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' })}</span>
                            <button class="btn btn-ghost btn-sm">View Details</button>
                        </div>
                    </div>
                `).join('');

                initScrollReveal();
            } catch (err) {
                container.innerHTML = `<div class="text-error">Failed to load orders: ${err.message}</div>`;
            }
        }

        function getStatusColor(status) {
            switch(status) {
                case 'delivered': return 'green';
                case 'shipped': return 'cyan';
                case 'processing': return 'orange';
                case 'cancelled': return 'red';
                default: return 'gray';
            }
        }
    </script>
    <script src="../assets/js/lang.js"></script>
    <script src="../assets/js/chatbot.js?v=2"></script>
</body>

</html>
